<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Japanese Word Kitchen — Dish Illustration Review</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        min-width: 0;
        margin: 0;
        padding: 14px;
      }

      .gallery {
        width: 100%;
        max-width: 1560px;
        margin: 0 auto;
      }

      .gallery-heading {
        margin: 4px 2px 12px;
      }

      .gallery-heading h1 {
        margin: 0 0 4px;
      }

      .gallery-heading p {
        margin: 0;
        color: var(--ink-soft);
      }

      .gallery-sheet {
        margin: 0 0 14px;
        padding: 10px;
        background: rgb(251 244 229 / 96%);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        scroll-margin-top: 10px;
      }

      .sheet-heading {
        display: flex;
        margin: 0 0 7px;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .sheet-heading h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .sheet-heading p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.76rem;
      }

      .dish-row {
        display: grid;
        grid-template-columns: 112px repeat(5, minmax(0, 1fr));
        align-items: stretch;
        gap: 5px;
        padding: 5px 0;
        border-top: 1px solid var(--line);
      }

      .dish-name {
        display: flex;
        padding: 6px;
        flex-direction: column;
        justify-content: center;
        color: var(--ink);
        background: #efe3c8;
        border-radius: 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.84rem;
        font-weight: 700;
      }

      .dish-name span {
        margin-top: 3px;
        color: var(--ink-soft);
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 400;
      }

      .dish-state {
        min-width: 0;
        padding: 4px;
        background: #f6efdf;
        border: 1px solid #e5d7bb;
        border-radius: 8px;
      }

      .state-label {
        margin: 0 0 2px;
        color: #6d5239;
        font-size: 0.67rem;
        font-weight: 800;
        text-align: center;
      }

      .dish-state .final-dish-art {
        width: 100%;
        margin: 0;
        padding: 2px 3px 3px;
        background: #f1dfb6;
        border: 0;
        border-radius: 6px;
        box-shadow: none;
        animation: none;
      }

      .dish-state .final-dish-art svg {
        width: 100%;
        max-height: none;
        filter: saturate(1.12) contrast(1.02);
      }

      .dish-state .final-dish-art figcaption {
        font-size: 0.58rem;
        line-height: 1.2;
        text-align: center;
      }

      .dish-state .ingredient-note {
        margin: 2px 0 0;
        font-size: 0.58rem;
        line-height: 1.2;
      }

      .dish-state .dish-sparkles {
        display: none;
      }

      .dish-state-empty {
        border: 0;
        background: transparent;
      }

      @media (max-width: 760px) {
        body {
          padding: 8px;
        }

        .gallery-sheet {
          overflow-x: auto;
        }

        .dish-row {
          min-width: 940px;
        }
      }
    </style>
  </head>
  <body>
    <main class="gallery">
      <header class="gallery-heading">
        <h1>Every dish, every ingredient count</h1>
        <p>Each row shows the original final-dish artwork from none earned to all key ingredients earned. Notes name anything still to add.</p>
      </header>
      <div id="gallery"></div>
    </main>
    <script type="module">
      import { DISHES } from "../data/dishes.js";
      import { finalDishArtwork } from "../utils/render.js";

      const gallery = document.querySelector("#gallery");
      const sheetSize = 5;

      for (let start = 0; start < DISHES.length; start += sheetSize) {
        const sheetDishes = DISHES.slice(start, start + sheetSize);
        const sheetNumber = Math.floor(start / sheetSize) + 1;
        const sheet = document.createElement("section");
        sheet.className = "gallery-sheet";
        sheet.id = `dish-sheet-${sheetNumber}`;
        sheet.setAttribute("aria-label", `Dish illustrations ${start + 1} to ${start + sheetDishes.length}`);
        sheet.innerHTML = `
          <header class="sheet-heading">
            <h2>Dishes ${start + 1}–${start + sheetDishes.length}</h2>
            <p>Each column adds one more earned ingredient</p>
          </header>`;

        for (const dish of sheetDishes) {
          const row = document.createElement("div");
          row.className = "dish-row";

          const name = document.createElement("div");
          name.className = "dish-name";
          name.textContent = dish.englishName;
          const japaneseName = document.createElement("span");
          japaneseName.lang = "ja";
          japaneseName.textContent = dish.japaneseName;
          name.append(japaneseName);
          row.append(name);

          for (let count = 0; count <= dish.ingredients.length; count += 1) {
            const state = document.createElement("div");
            state.className = "dish-state";
            state.innerHTML = `
              <p class="state-label">${count} / ${dish.ingredients.length} earned</p>
              ${finalDishArtwork(dish, dish.ingredients.slice(0, count))}`;
            row.append(state);
          }

          while (row.children.length < 6) {
            const empty = document.createElement("div");
            empty.className = "dish-state-empty";
            empty.setAttribute("aria-hidden", "true");
            row.append(empty);
          }

          sheet.append(row);
        }

        gallery.append(sheet);
      }

      if (location.hash) {
        document.querySelector(location.hash)?.scrollIntoView();
      }
    </script>
  </body>
</html>
